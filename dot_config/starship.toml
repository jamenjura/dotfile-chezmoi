format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$cmd_duration $jobs\
$fill\
$time\
$nodejs\
$line_break\
$character"""

scan_timeout = 30
add_newline = false
[nodejs]
format = "[$symbol($version )]($style)"

[fill]
symbol = " "

[line_break]
disabled = false

[directory]
style = "blue"
read_only = " "
truncation_length = 4
truncate_to_repo = false

[character]
success_symbol = "[❯❯](purple)"
error_symbol = "[❯❯](red)"
vimcmd_symbol = "[❮❮](green)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bright-black"

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style)"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
disabled = false

[cmd_duration]
format = "[$duration]($style)"
style = "yellow"

[memory_usage]
symbol = " "

[rust]
symbol = " "

[time]
disabled = false
style = "bold white"
format = "[$time]($style)"

[custom.stunnel]
when = "ps aux | grep stunnel | grep -v grep"
command = "ps -o etime= -p $(ps aux | grep stunnel | grep -v grep | awk '{print $2}')"
style = "red"
format = "[TUNNEL OPEN for $output]($style)"

# https://starship.rs/config/#kubernetes
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style)'
contexts = [
  { context_pattern = "*kind*", style = "cyan bold", symbol = "📚 " },
  { context_pattern = "*rancher-desktop*", style = "cyan bold", symbol = "📚 " },

  { context_pattern = "dev", style = "cyan bold", symbol = "🔵 " },
  { context_pattern = "homolog", style = "yellow bold", symbol = "🟡 " },
  { context_pattern = "prod", style = "red bold", symbol = "🔴 " },
]
